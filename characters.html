<!-- ================= TOP LEADERBOARD AD (728x90) ================= -->

    <div class="storynest-top-ad-inner">
        <script type="text/javascript">
            atOptions = {

		<main class="add-novel-container">

			<!-- HEADER -->

			<div class="add-novel-header">

				<p class="section-label">
					AUTHOR STUDIO
				</p>

				<h1 id="novelTitle">
					Characters
				</h1>

				<p>
					Create and manage the characters in your story.
				</p>

			</div>


			<!-- ADD CHARACTER -->

			<section class="chapter-editor">

				<div class="chapter-editor-top">

					<h2>
						Add Character
					</h2>

				</div>


				<div class="form-group">

					<label for="characterName">
						Character Name
					</label>

					<input
						type="text"
						id="characterName"
						placeholder="Example: Amara Williams"
            >

					</div>


				<div class="form-group">

					<label for="characterRole">
						Role
					</label>

					<select id="characterRole">

						<option value="">
							Select character role
						</option>

						<option value="Protagonist">
							Protagonist
						</option>

						<option value="Antagonist">
							Antagonist
						</option>

						<option value="Supporting Character">
							Supporting Character
						</option>

						<option value="Love Interest">
							Love Interest
						</option>

						<option value="Other">
							Other
						</option>

					</select>

				</div>


				<div class="form-group">

					<label for="characterDescription">
						Description
					</label>

					<textarea
						id="characterDescription"
						rows="7"
						placeholder="Describe this character..."
            ></textarea>

				</div>


				<div class="chapter-editor-buttons">

					<button
						class="secondary-btn"
						id="clearCharacter">

						Clear

					</button>


					<button
						class="primary-btn"
						id="saveCharacter">

						+ Add Character

					</button>

				</div>

			</section>


			<!-- CHARACTER LIST -->

			<section class="saved-chapters">

				<div class="section-heading">

					<div>

						<p class="section-label">
							YOUR STORY
						</p>

						<h2>
							Characters
						</h2>

					</div>

				</div>


				<div id="characterList">

					<div class="chapter-empty">

						<div>👤</div>

						<p>
							No characters yet.
						</p>

					</div>

				</div>

			</section>

		</main>

<!-- ================= STICKY BOTTOM AD BAR ================= -->
<div class="storynest-bottom-ad" id="storynestBottomAd">
    <button class="close-ad" id="closeBottomAd" aria-label="Close advertisement">✕</button>
    <div class="storynest-ad-content">
        <script type="text/javascript">
            atOptions = {
                'key' : 'ff80d71ae4bd0291f749548e7f51685e',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://www.highrevenueformat.com/ff80d71ae4bd0291f749548e7f51685e/invoke.js"></script>
    </div>
</div>

<script>
(function () {
    var adBar = document.getElementById('storynestBottomAd');
    var closeBtn = document.getElementById('closeBottomAd');
    if (!adBar || !closeBtn) return;

    if (sessionStorage.getItem('storynest_ad_closed') === '1') {
        adBar.classList.add('hidden');
        document.body.classList.add('bottom-ad-hidden');
        return;
    }

    closeBtn.addEventListener('click', function () {
        adBar.classList.add('hidden');
        document.body.classList.add('bottom-ad-hidden');
        sessionStorage.setItem('storynest_ad_closed', '1');
    });
})();
</script>
