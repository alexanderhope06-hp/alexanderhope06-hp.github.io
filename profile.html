<div class="storynest-top-ad">

<main class="add-novel-container">
    <div class="add-novel-header">
        <p class="section-label">AUTHOR PROFILE</p>
        <h1>Edit Your Profile</h1>
        <p>Update your author information and bio.</p>
    </div>

    <form id="profileForm" class="novel-form">
        <div class="form-group">
            <label for="profileDisplayName">Display Name</label>
            <input type="text" id="profileDisplayName" placeholder="Your author name">
        </div>

        <div class="form-group">
            <label for="profileBio">Bio</label>
            <textarea id="profileBio" rows="6" placeholder="Tell readers about yourself..."></textarea>
        </div>

        <div class="form-group">
            <label for="profileEmail">Email</label>
            <input type="email" id="profileEmail" disabled>
        </div>

        <div class="form-buttons">
            <a href="author.html" class="secondary-btn">Cancel</a>
            <button type="submit" class="primary-btn" id="saveProfile">Save Profile</button>
        </div>
    </form>
</main>
