<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Novel — StoryNest</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="image/fav.png">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">
        <img src="image/fav.png" alt="StoryNest" class="logo-icon">
        Story<span>Nest</span>
    </a>
    <a href="author.html" class="login-btn">← Dashboard</a>
</header>

<main class="add-novel-container">
    <div class="add-novel-header">
        <p class="section-label">AUTHOR STUDIO</p>
        <h1>Create Your Novel</h1>
        <p>Tell readers about your story.</p>
    </div>

    <form id="novelForm" class="novel-form">
        <div class="form-group">
            <label for="novelTitle">Novel Title</label>
            <input type="text" id="novelTitle" placeholder="Enter your novel title" required>
        </div>

        <div class="form-group">
            <label for="novelDescription">Description</label>
            <textarea id="novelDescription" rows="6" placeholder="Tell readers what your story is about..." required></textarea>
        </div>

        <div class="form-group">
            <label for="novelGenre">Genre</label>
            <select id="novelGenre">
                <option value="">Select a genre</option>
                <option>Romance</option>
                <option>Fantasy</option>
                <option>Mystery</option>
                <option>Thriller</option>
                <option>Drama</option>
                <option>Adventure</option>
                <option>Science Fiction</option>
            </select>
        </div>

        <div class="form-group">
            <label for="novelCover">Cover Image</label>
            <input type="file" id="novelCover" accept="image/*">
            <small>
                Recommended: portrait book cover (e.g. 600×900).<br>
                Best formats: <strong>WebP</strong> or <strong>JPEG</strong>.
                Max upload 100&nbsp;KB (auto-compressed).
                PNG only if you need transparency.
            </small>
            <img id="coverPreview" alt="Cover preview"
                 style="display:none;margin-top:12px;max-width:160px;border-radius:8px;">
        </div>

        <div class="form-buttons">
            <button type="button" class="secondary-btn">Save Draft</button>
            <button type="submit" class="primary-btn">Continue →</button>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/addNovel.js"></script>
</body>
</html>
