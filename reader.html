<body class="reader-page">

<header class="reader-header">
    <div class="reader-header-left">
        <a href="index.html" class="reader-back" title="Home">←</a>
        <div class="reader-header-info">

        </div>

    <div class="reader-actions">
        <button id="readerMenuBtn" class="reader-menu-btn" onclick="toggleReaderMenu(event)" title="Menu">⋮</button>

        <div class="reader-dropdown" id="readerDropdown">
            <a href="#" onclick="goToNovelDetails(); return false;">📚 Novel Details</a>
            <a href="#" onclick="goHome(); return false;">🏠 Home</a>
            <a href="#" onclick="toggleFontSize(); return false;" id="fontSizeBtn">🔤 18px</a>
            <a href="#" onclick="toggleTheme(); return false;" id="themeBtn">🌙 Dark Mode</a>
            <a href="https://unprofessionalginger.com/kpmqpcbd?key=337164613e9e4f3099a975553e256fa2"
               onclick="unlockAdFree();" target="_blank" id="adFreeBtn">
                🎁 Get Ad-Free (15 min)
            </a>
        </div>
    </div>
</header>

<div class="storynest-top-ad">
    <div class="storynest-top-ad-inner">
        <script type="text/javascript">
            atOptions = { 'key': '6e386924edca4892ed33ab2caa248000', 'format': 'iframe', 'height': 90, 'width': 728, 'params': {} };
        </script>
        <script src="https://unprofessionalginger.com/6e386924edca4892ed33ab2caa248000/invoke.js"></script>
    </div>
</div>

<div class="reading-progress" id="readingProgress"></div>

<main class="reader-container">
    <div class="reader-page-content" id="readerPageContent">
        <h1 id="chapterTitle">Loading...</h1>
        <div class="story" id="storyContent">
            <p>Loading chapter...</p>
        </div>
    </div>
</main>

<!-- 160x600 Skyscraper — floating on the right, desktop only -->
<aside class="reader-skyscraper" id="readerSkyscraper" aria-label="Advertisement">
    <script type="text/javascript">
        atOptions = {
            'key' : '7215dda459528e5a1b3fc407e017f036',
            'format' : 'iframe',
            'height' : 600,
            'width' : 160,
            'params' : {}
        };
    </script>
    <script src="https://unprofessionalginger.com/7215dda459528e5a1b3fc407e017f036/invoke.js"></script>
</aside>

<div class="storynest-bottom-ad" id="storynestBottomAd">
    <button class="close-ad" id="closeBottomAd" aria-label="Close advertisement">✕</button>
    <div class="storynest-ad-content">
        <script type="text/javascript">
            atOptions = { 'key': 'ff80d71ae4bd0291f749548e7f51685e', 'format': 'iframe', 'height': 50, 'width': 320, 'params': {} };
        </script>
        <script src="https://www.highrevenueformat.com/ff80d71ae4bd0291f749548e7f51685e/invoke.js"></script>
    </div>
</div>


<script>
    /*
     * Show the floating right-side ad only after the user
     * has scrolled past 600px. Prevents an ad-on-arrival.
     */
    (function () {
        'use strict';

        var ad = document.getElementById('readerSkyscraper');
        if (!ad) return;

        var mq = window.matchMedia('(min-width: 1400px)');
        if (!mq.matches) return;

        var revealed = false;
        var REVEAL_AT = 600;

        function checkScroll() {
            if (revealed) return;

            var y = window.scrollY
                 || window.pageYOffset
                 || document.documentElement.scrollTop
                 || 0;

            if (y >= REVEAL_AT) {
                ad.classList.add('revealed');
                revealed = true;
                window.removeEventListener('scroll', checkScroll);
            }
        }

        window.addEventListener('scroll', checkScroll, { passive: true });
        checkScroll();
    })();
</script>

<script src="js/ads.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
