<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reading — StoryNest</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="image/fav.png">
</head>

<body class="reader-page">

<!-- =====================================================
     READER HEADER
===================================================== -->

<header class="reader-header">

    <div class="reader-header-left">

        <a href="index.html" class="reader-back" title="Home">←</a>

        <div class="reader-header-info">
            <strong id="readerNovelTitle">Loading...</strong>
            <span id="chapterHeader">Chapter 1</span>
        </div>

        <!-- Ad-free countdown badge -->
        <span id="adFreeBadge" class="ad-free-badge" style="display:none;"></span>

    </div>

    <div class="reader-actions">

        <button
            id="readerMenuBtn"
            class="reader-menu-btn"
            onclick="toggleReaderMenu(event)"
            title="Menu">
            ⋮
        </button>

        <div class="reader-dropdown" id="readerDropdown">

            <a href="#" onclick="goToNovelDetails(); return false;">
                📚 Novel Details
            </a>

            <a href="#" onclick="goHome(); return false;">
                🏠 Home
            </a>

            <a href="#" onclick="toggleFontSize(); return false;" id="fontSizeBtn">
                🔤 18px
            </a>

            <a href="#" onclick="toggleTheme(); return false;" id="themeBtn">
                🌙 Dark Mode
            </a>

            <a href="https://unprofessionalginger.com/kpmqpcbd?key=337164613e9e4f3099a975553e256fa2"
               onclick="unlockAdFree();"
               target="_blank"
               id="adFreeBtn">
                🎁 Get Ad-Free (15 min)
            </a>

        </div>

    </div>

</header>


<!-- =====================================================
     TOP LEADERBOARD AD (728x90) — Desktop & Tablet only
===================================================== -->

<div class="storynest-top-ad">
    <div class="storynest-top-ad-inner">
        <script type="text/javascript">
            atOptions = {
                'key' : '6e386924edca4892ed33ab2caa248000',
                'format' : 'iframe',
                'height' : 90,
                'width' : 728,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://unprofessionalginger.com/6e386924edca4892ed33ab2caa248000/invoke.js"></script>
    </div>
</div>


<!-- =====================================================
     READING PROGRESS BAR
===================================================== -->

<div class="reading-progress" id="readingProgress"></div>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="reader-container">
    <div class="reader-page-content" id="readerPageContent">
        <h1 id="chapterTitle">Loading...</h1>
        <div class="story" id="storyContent">
            <p>Loading chapter...</p>
        </div>
        <!-- In-content ads are injected dynamically by reader.js -->
    </div>
</main>


<!-- =====================================================
     SCRIPTS
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/reader.js"></script>


<!-- =====================================================
     READER MENU & CONTROLS
===================================================== -->

<script>

    // =====================================================
    // MENU TOGGLE
    // =====================================================

    function toggleReaderMenu(event) {
        event.stopPropagation();
        const dropdown = document.getElementById('readerDropdown');
        if (dropdown) dropdown.classList.toggle('active');
    }

    document.addEventListener('click', function(e) {
        const dropdown = document.getElementById('readerDropdown');
        const menuBtn = document.getElementById('readerMenuBtn');
        if (dropdown && menuBtn && !dropdown.contains(e.target) && e.target !== menuBtn) {
            dropdown.classList.remove('active');
        }
    });


    // =====================================================
    // NAVIGATION
    // =====================================================

    function goToNovelDetails() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (id) window.location.href = 'novel.html?id=' + id;
    }

    function goHome() {
        window.location.href = 'index.html';
    }


    // =====================================================
    // FONT SIZE
    // =====================================================

    let currentFontSize = parseInt(localStorage.getItem('readerFontSize')) || 18;

    function toggleFontSize() {
        const sizes = [16, 18, 20, 22, 24, 26];
        let index = sizes.indexOf(currentFontSize);

        if (index === -1 || index === sizes.length - 1) {
            currentFontSize = sizes[0];
        } else {
            currentFontSize = sizes[index + 1];
        }

        applyFontSize(currentFontSize);
        localStorage.setItem('readerFontSize', currentFontSize);

        const btn = document.getElementById('fontSizeBtn');
        if (btn) btn.textContent = '🔤 ' + currentFontSize + 'px';

        // Notify reader.js so it can re-apply to newly rendered content
        window.dispatchEvent(new CustomEvent('readerFontSizeChanged', {
            detail: { size: currentFontSize }
        }));
    }

    function applyFontSize(size) {
        const content = document.querySelector('.reader-page-content');
        const story = document.querySelector('.story');
        const paragraphs = document.querySelectorAll('.reader-page-content p, .story p');

        if (content) content.style.fontSize = size + 'px';
        if (story) story.style.fontSize = size + 'px';
        paragraphs.forEach(function(p) { p.style.fontSize = size + 'px'; });
    }


    // =====================================================
    // THEME
    // =====================================================

    let currentTheme = localStorage.getItem('readerTheme') || 'light';

    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('themeBtn');

        if (currentTheme === 'light') {
            body.classList.add('dark-theme');
            currentTheme = 'dark';
            if (btn) btn.textContent = '☀️ Light Mode';
        } else {
            body.classList.remove('dark-theme');
            currentTheme = 'light';
            if (btn) btn.textContent = '🌙 Dark Mode';
        }

        localStorage.setItem('readerTheme', currentTheme);
    }

    function applyTheme(theme) {
        const body = document.body;
        const btn = document.getElementById('themeBtn');

        if (theme === 'dark') {
            body.classList.add('dark-theme');
            if (btn) btn.textContent = '☀️ Light Mode';
        } else {
            body.classList.remove('dark-theme');
            if (btn) btn.textContent = '🌙 Dark Mode';
        }

        currentTheme = theme;
    }


    // =====================================================
    // RESTORE PREFERENCES
    // =====================================================

    document.addEventListener('DOMContentLoaded', function() {

        const savedSize = localStorage.getItem('readerFontSize');
        if (savedSize) {
            currentFontSize = parseInt(savedSize);
            applyFontSize(currentFontSize);

            const btn = document.getElementById('fontSizeBtn');
            if (btn) btn.textContent = '🔤 ' + currentFontSize + 'px';
        }

        const savedTheme = localStorage.getItem('readerTheme');
        if (savedTheme) applyTheme(savedTheme);

    });


    // =====================================================
    // FORCE NORMAL PAGE SCROLL
    // =====================================================

    window.addEventListener('load', function() {
        document.documentElement.style.height = 'auto';
        document.body.style.height = 'auto';
        document.documentElement.style.overflowY = 'auto';
        document.body.style.overflowY = 'auto';
        document.body.style.overflowX = 'hidden';
    });


    console.log('📖 StoryNest reader loaded.');

</script>


<!-- =====================================================
     STICKY BOTTOM AD BAR (320x50)
===================================================== -->

<div class="storynest-bottom-ad" id="storynestBottomAd">
    <button class="close-ad" id="closeBottomAd" aria-label="Close advertisement">✕</button>
    <div class="storynest-ad-content">
        <script type="text/javascript">
            atOptions = {
                'key' : 'ff80d71ae4bd0291f749548e7f51685e',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://www.highrevenueformat.com/ff80d71ae4bd0291f749548e7f51685e/invoke.js"></script>
    </div>
</div>

<script>
(function () {
    var adBar = document.getElementById('storynestBottomAd');
    var closeBtn = document.getElementById('closeBottomAd');
    if (!adBar || !closeBtn) return;

    if (sessionStorage.getItem('storynest_ad_closed') === '1') {
        adBar.classList.add('hidden');
        document.body.classList.add('bottom-ad-hidden');
        return;
    }

    closeBtn.addEventListener('click', function () {
        adBar.classList.add('hidden');
        document.body.classList.add('bottom-ad-hidden');
        sessionStorage.setItem('storynest_ad_closed', '1');
    });
})();
</script>

<!-- ================= AD BLOCK DETECTION ================= -->
<script src="js/adblock-detect.js"></script>

</body>
</html>
