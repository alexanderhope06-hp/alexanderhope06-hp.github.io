<!-- =====================================================
     READER MENU & CONTROLS
===================================================== -->

<script>

    // =====================================================
    // MENU TOGGLE
    // =====================================================

    function toggleReaderMenu(event) {

        event.stopPropagation();

        const dropdown =
            document.getElementById('readerDropdown');

        if (dropdown) {
            dropdown.classList.toggle('active');
        }
    }


    // Close menu when clicking elsewhere

    document.addEventListener('click', function(e) {

        const dropdown =
            document.getElementById('readerDropdown');

        const menuBtn =
            document.getElementById('readerMenuBtn');

        if (
            dropdown &&
            menuBtn &&
            !dropdown.contains(e.target) &&
            e.target !== menuBtn
        ) {
            dropdown.classList.remove('active');
        }

    });


    // =====================================================
    // NAVIGATION
    // =====================================================

    function goToNovelDetails() {

        const params =
            new URLSearchParams(window.location.search);

        const id = params.get('id');

        if (id) {

            window.location.href =
                'novel.html?id=' + id;

        }

    }


    function goHome() {

        window.location.href =
            'index.html';

    }


    // =====================================================
    // FONT SIZE
    // =====================================================

    let currentFontSize =
        parseInt(
            localStorage.getItem('readerFontSize')
        ) || 18;


    function toggleFontSize() {

        const sizes =
            [16, 18, 20, 22, 24, 26];

        let index =
            sizes.indexOf(currentFontSize);

        if (
            index === -1 ||
            index === sizes.length - 1
        ) {

            currentFontSize =
                sizes[0];

        } else {

            currentFontSize =
                sizes[index + 1];

        }

        applyFontSize(currentFontSize);

        localStorage.setItem(
            'readerFontSize',
            currentFontSize
        );

        const btn =
            document.getElementById('fontSizeBtn');

        if (btn) {

            btn.textContent =
                '🔤 ' +
                currentFontSize +
                'px';

        }

    }


    function applyFontSize(size) {

        const content =
            document.querySelector(
                '.reader-page-content'
            );

        const story =
            document.querySelector(
                '.story'
            );

        const paragraphs =
            document.querySelectorAll(
                '.reader-page-content p, .story p'
            );


        if (content) {

            content.style.fontSize =
                size + 'px';

        }


        if (story) {

            story.style.fontSize =
                size + 'px';

        }


        paragraphs.forEach(function(p) {

            p.style.fontSize =
                size + 'px';

        });

    }


    // =====================================================
    // THEME
    // =====================================================

    let currentTheme =
        localStorage.getItem('readerTheme') ||
        'light';


    function toggleTheme() {

        const body =
            document.body;

        const btn =
            document.getElementById('themeBtn');


        if (currentTheme === 'light') {

            body.classList.add(
                'dark-theme'
            );

            currentTheme =
                'dark';


            if (btn) {

                btn.textContent =
                    '☀️ Light Mode';

            }

        } else {

            body.classList.remove(
                'dark-theme'
            );

            currentTheme =
                'light';


            if (btn) {

                btn.textContent =
                    '🌙 Dark Mode';

            }

        }


        localStorage.setItem(
            'readerTheme',
            currentTheme
        );

    }


    function applyTheme(theme) {

        const body =
            document.body;

        const btn =
            document.getElementById('themeBtn');


        if (theme === 'dark') {

            body.classList.add(
                'dark-theme'
            );


            if (btn) {

                btn.textContent =
                    '☀️ Light Mode';

            }

        } else {

            body.classList.remove(
                'dark-theme'
            );


            if (btn) {

                btn.textContent =
                    '🌙 Dark Mode';

            }

        }


        currentTheme =
            theme;

    }


    // =====================================================
    // RESTORE PREFERENCES
    // =====================================================

    document.addEventListener(
        'DOMContentLoaded',
        function() {

            // Restore font size

            const savedSize =
                localStorage.getItem(
                    'readerFontSize'
                );


            if (savedSize) {

                currentFontSize =
                    parseInt(savedSize);

                applyFontSize(
                    currentFontSize
                );


                const btn =
                    document.getElementById(
                        'fontSizeBtn'
                    );


                if (btn) {

                    btn.textContent =
                        '🔤 ' +
                        currentFontSize +
                        'px';

                }

            }


            // Restore theme

            const savedTheme =
                localStorage.getItem(
                    'readerTheme'
                );


            if (savedTheme) {

                applyTheme(
                    savedTheme
                );

            }


            // Hide chapter progress counter on mobile

            const progressEl =
                document.querySelector(
                    '.chapter-progress'
                );


            if (
                progressEl &&
                window.innerWidth < 768
            ) {

                progressEl.style.display =
                    'none';

            }

        }
    );


    // =====================================================
    // HANDLE RESIZE
    // =====================================================

    window.addEventListener(
        'resize',
        function() {

            const progressEl =
                document.querySelector(
                    '.chapter-progress'
                );


            if (progressEl) {

                if (
                    window.innerWidth < 768
                ) {

                    progressEl.style.display =
                        'none';

                } else {

                    progressEl.style.display =
                        'block';

                }

            }

        }
    );


    // =====================================================
    // FORCE NORMAL PAGE SCROLL
    // =====================================================

    window.addEventListener(
        'load',
        function() {

            document.documentElement.style.height =
                'auto';

            document.body.style.height =
                'auto';

            document.documentElement.style.overflowY =
                'auto';

            document.body.style.overflowY =
                'auto';

            document.body.style.overflowX =
                'hidden';

        }
    );


    console.log(
        '📖 StoryNest reader loaded with normal scrolling.'
    );

</script>

<script>
(function () {
    var adBar = document.getElementById('storynestBottomAd');
    var closeBtn = document.getElementById('closeBottomAd');
    if (!adBar || !closeBtn) return;

    if (sessionStorage.getItem('storynest_ad_closed') === '1') {
        adBar.classList.add('hidden');
        document.body.classList.add('bottom-ad-hidden');
        return;
    }

    closeBtn.addEventListener('click', function () {
        adBar.classList.add('hidden');
        document.body.classList.add('bottom-ad-hidden');
        sessionStorage.setItem('storynest_ad_closed', '1');
    });
})();



// =====================================================
// AD-FREE REWARD SYSTEM — Session-only, per-tab
// =====================================================

const AD_FREE_DURATION_MS = 15 * 60 * 1000;   // 15 minutes
const AD_FREE_KEY = 'storynestAdFreeUntil';
const SMARTPLINK_URL = 'https://www.highrevenueformat.com/YOUR_SMARTPLINK_HERE';

let adFreeInterval = null;

// --- Is ad-free active right now? ---
function isAdFree() {
    const until = parseInt(sessionStorage.getItem(AD_FREE_KEY) || '0', 10);
    return Date.now() < until;
}

// --- Grant 15 minutes to THIS TAB ONLY ---
function grantAdFree() {
    const until = Date.now() + AD_FREE_DURATION_MS;
    sessionStorage.setItem(AD_FREE_KEY, until);
    applyAdFreeState();
}

// --- Clear the reward (used when tab unloads) ---
function clearAdFree() {
    sessionStorage.removeItem(AD_FREE_KEY);
}

// --- Apply visual state ---
function applyAdFreeState() {
    const active = isAdFree();

    document.body.classList.toggle('ad-free-active', active);

    const badge = document.getElementById('adFreeBadge');
    if (badge) {
        badge.style.display = active ? 'inline-flex' : 'none';
        if (active) updateAdFreeBadge();
    }

    const btn = document.getElementById('adFreeBtn');
    if (btn) {
        btn.textContent = active
            ? '⏱ Ad-Free Active'
            : '🎁 Get Ad-Free (15 min)';
    }

    // Start / stop the countdown ticker
    if (active && !adFreeInterval) {
        adFreeInterval = setInterval(updateAdFreeBadge, 1000);
    } else if (!active && adFreeInterval) {
        clearInterval(adFreeInterval);
        adFreeInterval = null;
    }
}

// --- Update the countdown text ---
function updateAdFreeBadge() {
    const badge = document.getElementById('adFreeBadge');
    if (!badge) return;

    const until = parseInt(sessionStorage.getItem(AD_FREE_KEY) || '0', 10);
    const remaining = until - Date.now();

    if (remaining <= 0) {
        clearAdFree();
        applyAdFreeState();
        return;
    }

    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    badge.textContent = `Ad-Free ${mins}:${secs.toString().padStart(2, '0')}`;
}

// --- User clicked "Get Ad-Free" ---
function unlockAdFree() {
    if (isAdFree()) {
        alert('You already have ad-free time active in this tab! Enjoy 🎉');
        return;
    }

    const win = window.open(SMARTPLINK_URL, '_blank');

    if (!win) {
        alert('Please allow pop-ups for this site to unlock ad-free reading.');
        return;
    }

    // Wait for the Smartlink tab to close
    const check = setInterval(() => {
        if (win.closed) {
            clearInterval(check);
            grantAdFree();
            alert('🎉 Ad-free unlocked for 15 minutes in this tab!');
        }
    }, 800);

    // Safety net — grant after 45s even if the tab stays open
    setTimeout(() => {
        clearInterval(check);
        if (!isAdFree()) grantAdFree();
    }, 45000);
}

// --- Initialize ---
document.addEventListener('DOMContentLoaded', () => {
    applyAdFreeState();
});

// --- CRITICAL: end reward when leaving the page ---
// sessionStorage is per-tab, but this adds an extra guarantee:
window.addEventListener('beforeunload', () => {
    clearAdFree();
});

// Also end reward if the tab becomes hidden for too long (e.g. user switched tabs for 30+ min)
let hiddenAt = null;
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        hiddenAt = Date.now();
    } else {
        // If the tab was hidden for more than 15 min, wipe the reward
        if (hiddenAt && Date.now() - hiddenAt > AD_FREE_DURATION_MS) {
            clearAdFree();
        }
        hiddenAt = null;
        applyAdFreeState();
    }
});

// Re-check state when the tab regains focus
window.addEventListener('focus', applyAdFreeState);

</script>
