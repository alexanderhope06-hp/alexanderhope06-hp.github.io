<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — StoryNest</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">📖 Story<span>Nest</span></a>
    <a href="signup.html" class="login-btn">Create Account</a>


</header>

<!-- ================= TOP LEADERBOARD AD (728x90) ================= -->
<div class="storynest-top-ad">
    <div class="storynest-top-ad-inner">
        <script type="text/javascript">
            atOptions = {
                'key' : '6e386924edca4892ed33ab2caa248000',
                'format' : 'iframe',
                'height' : 90,
                'width' : 728,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://unprofessionalginger.com/6e386924edca4892ed33ab2caa248000/invoke.js"></script>
    </div>
</div>


</header>

<main class="auth-container">
    <div class="auth-card">
        <p class="section-label">WELCOME BACK</p>
        <h1>Login</h1>
        <p class="auth-subtitle">Continue writing and sharing your stories.</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Your password" required>
            </div>

            <button type="submit" class="primary-btn auth-submit">Login</button>
        </form>

        <p id="authMessage" class="auth-message"></p>

        <p class="auth-switch">
            Don't have an account? <a href="signup.html">Create one</a>
        </p>
    </div>
</main>

<footer>
    <div class="footer-logo">📖 StoryNest</div>
    <p>Discover. Read. Imagine.</p>
    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="faq.html">FAQ</a>
        <a href="guidelines.html">Guidelines</a>
        <a href="sitemap.html">Sitemap</a>
    </div>
    <p class="copyright">© 2026 StoryNest. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>


<!-- ================= STICKY BOTTOM AD BAR ================= -->
<div class="storynest-bottom-ad" id="storynestBottomAd">
    <button class="close-ad" id="closeBottomAd" aria-label="Close advertisement">✕</button>
    <div class="storynest-ad-content">
        <script type="text/javascript">
            atOptions = {
                'key' : 'ff80d71ae4bd0291f749548e7f51685e',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://www.highrevenueformat.com/ff80d71ae4bd0291f749548e7f51685e/invoke.js"></script>
    </div>
</div>

<script>
(function () {
    var adBar = document.getElementById('storynestBottomAd');
    var closeBtn = document.getElementById('closeBottomAd');
    if (!adBar || !closeBtn) return;

    if (sessionStorage.getItem('storynest_ad_closed') === '1') {
        adBar.classList.add('hidden');
        document.body.classList.add('bottom-ad-hidden');
        return;
    }

    closeBtn.addEventListener('click', function () {
        adBar.classList.add('hidden');
        document.body.classList.add('bottom-ad-hidden');
        sessionStorage.setItem('storynest_ad_closed', '1');
    });
})();
</script>



</body>
</html>
